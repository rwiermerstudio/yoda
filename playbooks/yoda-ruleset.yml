---
# copyright Utrecht University
# Layered Playbook (Phase 1 / Option C): Yoda Ruleset Application Layer
#
# Installs the prebuilt, version-pinned yoda-ruleset OS package (.deb / .rpm)
# and deploys a pre-validated rules_uu.cfg rendered by `yoda-config render`.
# Does NOT run live git clone, git apply, make install, or pip on production hosts.

- name: Deploy packaged Yoda ruleset to iCAT and resource servers
  hosts: icats,resources
  become: true
  vars:
    yoda_ruleset_package: "yoda-ruleset"
    yoda_ruleset_version: ""
    yoda_rendered_rules_cfg: ""
    yoda_irods_service_account: "irods"
    yoda_run_migrations: true
  handlers:
    - name: Restart iRODS service
      ansible.builtin.systemd:
        name: irods
        state: restarted

  tasks:
    - name: Verify pre-rendered rules_uu.cfg path is provided
      ansible.builtin.assert:
        that:
          - yoda_rendered_rules_cfg | length > 0
        fail_msg: >
          Set -e yoda_rendered_rules_cfg=/path/to/rendered/icat/rules_uu.cfg
          generated by `yoda-config render`.

    - name: Install version-pinned yoda-ruleset package
      ansible.builtin.package:
        name: "{{ yoda_ruleset_package if (yoda_ruleset_version | length == 0) else (yoda_ruleset_package ~ '=' ~ yoda_ruleset_version if ansible_facts['os_family'] == 'Debian' else yoda_ruleset_package ~ '-' ~ yoda_ruleset_version) }}"
        state: present
      notify: Restart iRODS service

    - name: Ensure institutional ruleset extension directory exists
      ansible.builtin.file:
        path: /etc/irods/yoda-extensions.d
        state: directory
        owner: "{{ yoda_irods_service_account }}"
        group: "{{ yoda_irods_service_account }}"
        mode: "0750"

    - name: Deploy pre-validated rules_uu.cfg
      ansible.builtin.copy:
        src: "{{ yoda_rendered_rules_cfg }}"
        dest: /etc/irods/yoda-ruleset/rules_uu.cfg
        owner: "{{ yoda_irods_service_account }}"
        group: "{{ yoda_irods_service_account }}"
        mode: "0600"
      no_log: true
      notify: Restart iRODS service

    - name: Flush handlers to reload iRODS before migrations
      ansible.builtin.meta: flush_handlers

    - name: Install yoda-migrate runner on iCAT
      ansible.builtin.copy:
        src: ../tools/yoda_migrate/yoda-migrate
        dest: /usr/local/bin/yoda-migrate
        owner: root
        group: root
        mode: "0755"
      when: "'icats' in group_names"

    - name: Run idempotent post-upgrade migrations on iCAT
      ansible.builtin.command:
        cmd: >-
          /usr/local/bin/yoda-migrate
          --version "{{ yoda_ruleset_version | default('current', true) }}"
          {{ '--dry-run' if ansible_check_mode else '' }}
      become_user: "{{ yoda_irods_service_account }}"
      changed_when: false
      when:
        - "'icats' in group_names"
        - yoda_run_migrations | bool
