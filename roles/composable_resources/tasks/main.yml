---
# copyright Utrecht University

# In case NFS resources are enabled, creating mount points is handled
# by the nfs_client role instead.
- name: Create vault directories on development environment
  with_items: "{{ irods_resources }}"
  ansible.builtin.file:
    path: "{{ item.vault_path }}"
    state: directory
    owner: "{{ irods_service_account }}"
    group: "{{ irods_service_account }}"
    mode: "0755"
  when: |
    yoda_environment == "development"
    and not enable_nfs_resource
    and item.resource_type == "unixfilesystem"
    and 'vault_path' in item
    and 'host' in item
    and item.host == (yoda_fqdn | default(ansible_facts['fqdn']))


- name: Ensure all resources exist
  become_user: '{{ irods_service_account }}'
  become: true
  # noqa fqcn[action]
  irods_resource:
    name: "{{ item.name }}"
    resource_type: "{{ item.resource_type }}"
    host: "{{ item.host | default('EMPTY_RESC_HOST') }}"
    vault_path: "{{ item.vault_path | default('EMPTY_RESC_PATH') }}"
    children: "{{ item.children | default([]) }}"
    context: "{{ item.context | default('') }}"
    modify: "{{ yoda_environment == 'development' or (irods_modify_resources | bool) }}"
  with_items: "{{ irods_resources }}"
  when: not ansible_check_mode


- name: Remove unused local bootstrap Vault directory when no unixfilesystem resources exist
  ansible.builtin.file:
    path: "{{ irods_vault_directory }}"
    state: absent
  when: |
    yoda_environment == "development"
    and (irods_resources | selectattr('resource_type', 'equalto', 'unixfilesystem') | list | length) == 0
