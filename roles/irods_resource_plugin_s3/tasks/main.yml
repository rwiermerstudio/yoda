---
# copyright Utrecht University

- name: Include OS-specific variables
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"


- name: Ensure iRODS resource plugin S3 is installed
  ansible.builtin.package:
    name: "{{ irods_resource_plugin_s3_package }}"
    state: present
  when: not ansible_check_mode


- name: Ensure iRODS resource plugin S3 is pinned
  ansible.builtin.template:
    src: 'irods_resource_plugin_s3.pref.j2'
    dest: '/etc/apt/preferences.d/irods_resource_plugin_s3.pref'
    mode: '0644'
    owner: 'root'
    group: 'root'
  when: ansible_facts['os_family'] == 'Debian'


- name: Ensure S3 credentials file is present
  ansible.builtin.template:
    src: s3auth.j2
    dest: '{{ s3_auth_file }}'
    owner: '{{ irods_service_account }}'
    group: '{{ irods_service_account }}'
    mode: '0600'
  no_log: true


- name: Ensure S3 cache directory is present
  ansible.builtin.file:
    path: '{{ s3_cache_dir }}'
    state: directory
    owner: '{{ irods_service_account }}'
    group: '{{ irods_service_account }}'
    mode: '0700'
  when: s3_cache_dir != '/tmp'


- name: Ensure S3 cache directory persists across reboots via tmpfiles.d
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/irods-s3-cache.conf
    content: "d {{ s3_cache_dir }} 0700 {{ irods_service_account }} {{ irods_service_account }} -\n"
    owner: root
    group: root
    mode: '0644'
  when: s3_cache_dir != '/tmp'
